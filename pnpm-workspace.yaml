packages:
  - "apps/*"
  - "packages/*"

# Security pins for transitive @modelcontextprotocol/sdk runtime dependencies.
overrides:
  "@modelcontextprotocol/sdk>@hono/node-server": "^1.19.15"
  "@modelcontextprotocol/sdk>hono": "^4.13.11"
  "express@5.2.1>body-parser": "2.4.0"
  # GHSA-jqcg-44mw-7w3h: express@5.2.1 resolves proxy-addr 2.0.7 unless pinned.
  "express@5.2.1>proxy-addr": "^2.0.8"
  # GHSA-68fv-2mgg-jv7q: postcss still resolves source-map-js 1.2.1.
  "source-map-js@<1.2.2": "^1.2.2"
  # Security pins for Fastify and MCP transitive URI and IP address parsing.
  "ajv@8.20.0>fast-uri": "3.1.9"
  "@fastify/ajv-compiler@4.0.6>fast-uri": "4.2.3"
  "fast-json-stringify@7.0.1>fast-uri": "4.2.3"
  "@fastify/rate-limit@11.2.0>ip-address": "10.7.4"
  "express-rate-limit@8.5.2>ip-address": "10.7.4"

allowBuilds:
  esbuild: true
