services:
  postgres:
    image: pgvector/pgvector:pg17@sha256:d2ef61f42ef767baa5a1475393303cc235bcd92febd9d7014eddb48b41f3bad0
    environment:
      POSTGRES_DB: forgetbase
      POSTGRES_USER: forgetbase
      POSTGRES_PASSWORD: forgetbase_dev
    ports:
      - "${FORGETBASE_POSTGRES_PORT:-127.0.0.1:5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/docker/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U forgetbase -d forgetbase"]
      interval: 10s
      timeout: 5s
      retries: 5

  migrate:
    build:
      context: .
      dockerfile: infra/docker/node.Dockerfile
    command: ["pnpm", "db:migrate"]
    environment:
      DATABASE_URL: postgres://forgetbase:forgetbase_dev@postgres:5432/forgetbase
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  clamav:
    image: clamav/clamav:1.5.4-debian13-slim@sha256:be3cb41d9833ce9ffb98f3d3e1483c35c0d87060c2bda3624d75fd28bbf0b3bd
    volumes:
      - clamav-data:/var/lib/clamav
    healthcheck:
      test: ["CMD-SHELL", "printf 'PING\\n' | nc 127.0.0.1 3310 | grep -qx PONG"]
      start_period: 180s
      interval: 15s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: infra/docker/node.Dockerfile
    command: ["pnpm", "--filter", "@forgetbase/api", "start"]
    environment:
      HOST: 0.0.0.0
      PORT: 3000
      DATABASE_URL: postgres://forgetbase:forgetbase_dev@postgres:5432/forgetbase
      FORGETBASE_REQUIRE_AUTHENTICATION: ${FORGETBASE_REQUIRE_AUTHENTICATION:-false}
      FORGETBASE_SESSION_COOKIE_SECURE: ${FORGETBASE_SESSION_COOKIE_SECURE:-false}
      FORGETBASE_OIDC_STATE_SECRET: ${FORGETBASE_OIDC_STATE_SECRET:-}
      FORGETBASE_CORS_ALLOWED_ORIGINS: ${FORGETBASE_CORS_ALLOWED_ORIGINS:-http://127.0.0.1:5175,http://localhost:5175}
      FORGETBASE_LOGIN_SESSION_MAX_AGE_SECONDS: ${FORGETBASE_LOGIN_SESSION_MAX_AGE_SECONDS:-43200}
      FORGETBASE_LOGIN_SESSION_IDLE_TIMEOUT_SECONDS: ${FORGETBASE_LOGIN_SESSION_IDLE_TIMEOUT_SECONDS:-14400}
      FORGETBASE_LOGIN_SESSION_ABSOLUTE_MAX_AGE_SECONDS: ${FORGETBASE_LOGIN_SESSION_ABSOLUTE_MAX_AGE_SECONDS:-2592000}
      FORGETBASE_LOGIN_REFRESH_TOKEN_MAX_AGE_SECONDS: ${FORGETBASE_LOGIN_REFRESH_TOKEN_MAX_AGE_SECONDS:-604800}
      FORGETBASE_LOGIN_THROTTLE_MAX_ATTEMPTS: ${FORGETBASE_LOGIN_THROTTLE_MAX_ATTEMPTS:-5}
      FORGETBASE_LOGIN_THROTTLE_WINDOW_MS: ${FORGETBASE_LOGIN_THROTTLE_WINDOW_MS:-60000}
      FORGETBASE_LOGIN_THROTTLE_BLOCK_MS: ${FORGETBASE_LOGIN_THROTTLE_BLOCK_MS:-60000}
      FORGETBASE_LOGIN_THROTTLE_MAX_ENTRIES: ${FORGETBASE_LOGIN_THROTTLE_MAX_ENTRIES:-10000}
      FORGETBASE_REQUEST_RATE_LIMIT_MAX: ${FORGETBASE_REQUEST_RATE_LIMIT_MAX:-1000}
      FORGETBASE_REQUEST_RATE_LIMIT_WINDOW_MS: ${FORGETBASE_REQUEST_RATE_LIMIT_WINDOW_MS:-60000}
      FORGETBASE_REQUEST_RATE_LIMIT_MAX_ENTRIES: ${FORGETBASE_REQUEST_RATE_LIMIT_MAX_ENTRIES:-5000}
      FORGETBASE_ATTACHMENT_STORAGE_ROOT: /var/lib/forgetbase/attachments
      FORGETBASE_ATTACHMENT_MAX_BYTES: ${FORGETBASE_ATTACHMENT_MAX_BYTES:-10485760}
      FORGETBASE_ATTACHMENT_TENANT_MAX_BYTES: ${FORGETBASE_ATTACHMENT_TENANT_MAX_BYTES:-1073741824}
      FORGETBASE_ATTACHMENT_TENANT_MAX_FILES: ${FORGETBASE_ATTACHMENT_TENANT_MAX_FILES:-1000}
      FORGETBASE_ATTACHMENT_PRINCIPAL_MAX_BYTES: ${FORGETBASE_ATTACHMENT_PRINCIPAL_MAX_BYTES:-268435456}
      FORGETBASE_ATTACHMENT_PRINCIPAL_MAX_FILES: ${FORGETBASE_ATTACHMENT_PRINCIPAL_MAX_FILES:-250}
      FORGETBASE_ATTACHMENT_UPLOADS_PER_MINUTE: ${FORGETBASE_ATTACHMENT_UPLOADS_PER_MINUTE:-30}
      FORGETBASE_ATTACHMENT_MAX_CONCURRENT_UPLOADS: ${FORGETBASE_ATTACHMENT_MAX_CONCURRENT_UPLOADS:-4}
      FORGETBASE_ATTACHMENT_SCAN_REQUIRED: "true"
      FORGETBASE_ATTACHMENT_CLAMD_HOST: clamav
      FORGETBASE_ATTACHMENT_CLAMD_PORT: 3310
      FORGETBASE_ATTACHMENT_SCAN_TIMEOUT_MS: ${FORGETBASE_ATTACHMENT_SCAN_TIMEOUT_MS:-15000}
      FORGETBASE_ATTACHMENT_RECONCILIATION_ENABLED: "true"
      FORGETBASE_ATTACHMENT_RECONCILIATION_DRY_RUN: "true"
      FORGETBASE_ATTACHMENT_RECONCILIATION_INTERVAL_MS: ${FORGETBASE_ATTACHMENT_RECONCILIATION_INTERVAL_MS:-3600000}
    ports:
      - "${FORGETBASE_API_PORT:-127.0.0.1:3000}:3000"
    volumes:
      - attachment-data:/var/lib/forgetbase/attachments
    depends_on:
      migrate:
        condition: service_completed_successfully
      clamav:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --output-document=- http://127.0.0.1:3000/ready >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 5

  worker:
    build:
      context: .
      dockerfile: infra/docker/node.Dockerfile
    command: ["pnpm", "--filter", "@forgetbase/worker", "start"]
    environment:
      DATABASE_URL: postgres://forgetbase:forgetbase_dev@postgres:5432/forgetbase
      # Set enabled=true and dry-run=false only after validating retention counts.
      FORGETBASE_RETENTION_PURGE_ENABLED: "false"
      FORGETBASE_RETENTION_PURGE_DRY_RUN: "true"
      FORGETBASE_RETENTION_PURGE_INTERVAL_MS: "86400000"
      # Set enabled=true and dry-run=false only after validating cache purge counts.
      FORGETBASE_CACHE_PURGE_ENABLED: "false"
      FORGETBASE_CACHE_PURGE_DRY_RUN: "true"
      FORGETBASE_CACHE_PURGE_INTERVAL_MS: "3600000"
      # Set enabled=true and dry-run=false only after validating rotation reminder counts.
      FORGETBASE_API_KEY_ROTATION_REMINDERS_ENABLED: "false"
      FORGETBASE_API_KEY_ROTATION_REMINDERS_DRY_RUN: "true"
      FORGETBASE_API_KEY_ROTATION_REMINDERS_DUE_WITHIN_DAYS: "14"
      FORGETBASE_API_KEY_ROTATION_REMINDERS_DEDUPE_WINDOW_HOURS: "24"
      FORGETBASE_API_KEY_ROTATION_REMINDERS_INTERVAL_MS: "86400000"
      FORGETBASE_API_KEY_ROTATION_REMINDERS_WEBHOOK_URL: ${FORGETBASE_API_KEY_ROTATION_REMINDERS_WEBHOOK_URL:-}
      FORGETBASE_API_KEY_ROTATION_REMINDERS_WEBHOOK_SIGNING_SECRET: ${FORGETBASE_API_KEY_ROTATION_REMINDERS_WEBHOOK_SIGNING_SECRET:-}
      FORGETBASE_API_KEY_ROTATION_REMINDERS_WEBHOOK_TIMEOUT_MS: ${FORGETBASE_API_KEY_ROTATION_REMINDERS_WEBHOOK_TIMEOUT_MS:-5000}
      # Set enabled=true and dry-run=false only after validating scheduled eval policy counts.
      FORGETBASE_MANAGED_QUERY_EVALS_ENABLED: "false"
      FORGETBASE_MANAGED_QUERY_EVALS_DRY_RUN: "true"
      FORGETBASE_MANAGED_QUERY_EVALS_INTERVAL_MS: "3600000"
      FORGETBASE_MANAGED_QUERY_EVALS_LIMIT: "100"
      # Set enabled=true and dry-run=false only after validating expired action approval counts.
      FORGETBASE_ACTION_APPROVAL_EXPIRY_ENABLED: "false"
      FORGETBASE_ACTION_APPROVAL_EXPIRY_DRY_RUN: "true"
      FORGETBASE_ACTION_APPROVAL_EXPIRY_INTERVAL_MS: "3600000"
      FORGETBASE_ACTION_APPROVAL_EXPIRY_LIMIT: "500"
    depends_on:
      migrate:
        condition: service_completed_successfully

  web:
    build:
      context: .
      dockerfile: infra/docker/node.Dockerfile
    command: ["pnpm", "--filter", "@forgetbase/web", "exec", "vite", "preview", "--host", "0.0.0.0"]
    ports:
      - "${FORGETBASE_WEB_PORT:-127.0.0.1:5175}:4173"
    depends_on:
      - api

volumes:
  postgres-data:
  attachment-data:
  clamav-data:
