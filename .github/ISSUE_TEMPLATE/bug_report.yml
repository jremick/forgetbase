name: Bug report
description: Report a reproducible ForgetBase bug.
title: "[Bug]: "
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. Do not include secrets, private corpus content, raw logs with tokens, or customer data.
        Use the security policy for suspected vulnerabilities or restricted-content leakage.
  - type: input
    id: version
    attributes:
      label: Version or commit
      description: Tag, commit SHA, or branch you tested.
      placeholder: v0.1.0-beta.1 or 0123456
    validations:
      required: true
  - type: dropdown
    id: surface
    attributes:
      label: Surface
      options:
        - Reader UI
        - Admin console
        - API
        - CLI
        - MCP server
        - Worker
        - Docker Compose
        - Docs
        - Other
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      description: Give the smallest reliable path to reproduce the bug.
      placeholder: |
        1. Start with ...
        2. Run ...
        3. Open ...
        4. See ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What should have happened?
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What happened instead?
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include only non-sensitive environment details.
      placeholder: |
        OS:
        Node:
        pnpm:
        Docker:
        Browser:
        Deployment mode: local compose / same-origin proxy / other
    validations:
      required: true
  - type: textarea
    id: checks
    attributes:
      label: Checks run
      description: Paste command names and summaries, not secret-bearing output.
      placeholder: |
        npx -y pnpm@11.7.0 typecheck
        npx -y pnpm@11.7.0 test
        npx -y pnpm@11.7.0 test:uat
  - type: checkboxes
    id: safety
    attributes:
      label: Safety check
      options:
        - label: I did not include secrets, private data, raw tokens, database dumps, or private corpus content.
          required: true
        - label: This is not a suspected security vulnerability.
          required: true
