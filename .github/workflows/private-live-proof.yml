name: Private live isolated proof

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: private-live-isolated-proof-${{ github.ref }}
  cancel-in-progress: true

jobs:
  proof:
    name: Isolated full-stack proof
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.7.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "26.10.0"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Build deployment images and record runtime versions
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/deployment-image-proof"
          source_epoch="$(git show -s --format=%ct HEAD)"
          for service in api worker web proxy; do
            image="forgetbase-proof-${GITHUB_RUN_ID}-${service}"
            docker build --progress=plain \
              --file "infra/docker/railway-${service}.Dockerfile" \
              --build-arg "FORGETBASE_SOURCE_REVISION=${GITHUB_SHA}" \
              --build-arg "FORGETBASE_SOURCE_DATE_EPOCH=${source_epoch}" \
              --build-arg "FORGETBASE_RELEASE_VERSION=0.0.0-proof" \
              --build-arg "VITE_ENABLE_RICH_EDITOR=true" \
              --tag "$image" . 2>&1 | tee "${RUNNER_TEMP}/deployment-image-proof/${service}-build.log"
            if [ "$service" = proxy ]; then
              docker run --rm --entrypoint nginx "$image" -v 2>&1 | tee "${RUNNER_TEMP}/deployment-image-proof/${service}-runtime.txt"
            else
              docker run --rm --entrypoint node "$image" --version | tee "${RUNNER_TEMP}/deployment-image-proof/${service}-runtime.txt"
            fi
            docker image rm "$image"
          done

      - name: Upload deployment image evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: deployment-image-proof-${{ github.run_id }}
          path: ${{ runner.temp }}/deployment-image-proof
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - name: Run private live isolated proof
        run: pnpm private-live:isolated-proof
        env:
          PRIVATE_LIVE_PROOF_DIR: ${{ runner.temp }}/private-live-proof
          PRIVATE_LIVE_REQUIRE_CLEAN: "1"
          KEEP_PRIVATE_LIVE_STACK: "0"

      - name: Upload private live proof evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: private-live-proof-${{ github.run_id }}
          path: ${{ runner.temp }}/private-live-proof
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
