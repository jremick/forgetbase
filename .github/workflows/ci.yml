name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 25

    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_DB: forgetbase
          POSTGRES_USER: forgetbase
          POSTGRES_PASSWORD: forgetbase_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U forgetbase -d forgetbase"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      TEST_DATABASE_URL: postgres://forgetbase:forgetbase_dev@127.0.0.1:5432/forgetbase

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@v6.0.9
        with:
          version: 11.7.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build

      - name: Validate demo corpus
        run: pnpm --filter @forgetbase/cli start -- validate --file corpus/demo/assets.json --as-of 2026-06-16 --fail-on-warnings

      - name: Validate Compose config
        run: docker compose -f compose.yaml config --quiet

      - name: Validate same-origin Compose config
        run: docker compose -f compose.yaml -f compose.same-origin.yaml config --quiet

      - name: Validate TLS Compose config
        run: docker compose -f compose.yaml -f compose.same-origin.yaml -f compose.tls.yaml config --quiet

      - name: Check OpenAPI drift
        run: pnpm openapi:check

      - name: Lint public claims
        run: pnpm claims:lint

      - name: Check beta contracts
        run: pnpm contracts:check

      - name: Test
        run: pnpm test
