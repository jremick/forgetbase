name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 25

    services:
      postgres:
        image: pgvector/pgvector:pg17@sha256:d2ef61f42ef767baa5a1475393303cc235bcd92febd9d7014eddb48b41f3bad0
        env:
          POSTGRES_DB: forgetbase
          POSTGRES_USER: forgetbase
          POSTGRES_PASSWORD: forgetbase_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U forgetbase -d forgetbase"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      TEST_DATABASE_URL: postgres://forgetbase:forgetbase_dev@127.0.0.1:5432/forgetbase

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 11.7.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build

      - name: Enforce web bundle budget
        run: pnpm web:bundle-budget

      - name: Check public beta UI source gate
        run: pnpm public-beta:check

      - name: Check deployment security defaults
        run: pnpm security:check-deployment-defaults

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Run public beta UAT
        run: UAT_OUTPUT_DIR="${RUNNER_TEMP}/public-beta-uat" pnpm test:uat

      - name: Upload public beta UAT evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: public-beta-uat
          path: ${{ runner.temp }}/public-beta-uat
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - name: Validate demo corpus
        run: pnpm --filter @forgetbase/cli start -- validate --file corpus/demo/assets.json --as-of 2026-06-16 --fail-on-warnings

      - name: Validate Compose config
        run: docker compose -f compose.yaml config --quiet

      - name: Validate same-origin Compose config
        run: docker compose -f compose.yaml -f compose.same-origin.yaml config --quiet

      - name: Validate TLS Compose config
        run: docker compose -f compose.yaml -f compose.same-origin.yaml -f compose.tls.yaml config --quiet

      - name: Check OpenAPI drift
        run: pnpm openapi:check

      - name: Lint public claims
        run: pnpm claims:lint

      - name: Check beta contracts
        run: pnpm contracts:check

      - name: Test
        run: pnpm test
