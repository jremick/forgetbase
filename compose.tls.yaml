services:
  api:
    environment:
      FORGETBASE_SESSION_COOKIE_SECURE: "true"
      FORGETBASE_CORS_ALLOWED_ORIGINS: ${FORGETBASE_CORS_ALLOWED_ORIGINS:-https://127.0.0.1:8443,https://localhost:8443}

  proxy:
    ports:
      - "${FORGETBASE_HTTPS_PORT:-8443}:8443"
    volumes:
      - ./infra/docker/nginx.tls.conf:/etc/nginx/conf.d/default.conf:ro
      - ./infra/docker/tls/tls.crt:/etc/nginx/tls/tls.crt:ro
      - ./infra/docker/tls/tls.key:/etc/nginx/tls/tls.key:ro
