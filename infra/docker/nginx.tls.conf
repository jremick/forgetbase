map $http_host $agentic_cms_https_host {
  default $http_host;
  "127.0.0.1:8080" "127.0.0.1:8443";
  "localhost:8080" "localhost:8443";
}

server {
  listen 8080;
  server_name _;

  return 308 https://$agentic_cms_https_host$request_uri;
}

server {
  listen 8443 ssl;
  server_name _;

  ssl_certificate /etc/nginx/tls/tls.crt;
  ssl_certificate_key /etc/nginx/tls/tls.key;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_prefer_server_ciphers off;
  ssl_session_cache shared:agentic_cms_tls:10m;
  ssl_session_timeout 1d;

  add_header Strict-Transport-Security "max-age=15552000" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "no-referrer" always;

  client_max_body_size 10m;
  resolver 127.0.0.11 valid=10s ipv6=off;
  set $api_upstream http://api:3000;
  set $web_upstream http://web:4173;

  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Host $host;
  proxy_set_header X-Forwarded-Port $server_port;
  proxy_set_header X-Forwarded-Proto https;
  proxy_set_header X-Forwarded-Ssl on;

  location = /api {
    return 308 /api/;
  }

  location /api/ {
    rewrite ^/api/(.*)$ /$1 break;
    proxy_pass $api_upstream;
  }

  location / {
    proxy_pass $web_upstream;
  }
}
