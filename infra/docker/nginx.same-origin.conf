# Keep query strings, credentials and referrers out of proxy logs.
log_format forgetbase_safe '$remote_addr [$time_local] "$request_method $uri $server_protocol" $status $body_bytes_sent';

server {
  access_log /dev/stdout forgetbase_safe;
  error_log /dev/stderr crit;
  listen 8080;
  server_name _;

  client_max_body_size 10m;
  resolver 127.0.0.11 valid=10s ipv6=off;
  set $api_upstream http://api:3000;
  set $web_upstream http://web:4173;

  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Host $host;
  proxy_set_header X-Forwarded-Port $server_port;
  proxy_set_header X-Forwarded-Proto $scheme;

  location = /api {
    return 308 /api/;
  }

  location /api/ {
    rewrite ^/api/(.*)$ /$1 break;
    proxy_pass $api_upstream;
  }

  location / {
    proxy_pass $web_upstream;
  }
}
