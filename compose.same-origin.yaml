services:
  api:
    environment:
      FORGETBASE_CORS_ALLOWED_ORIGINS: ${FORGETBASE_CORS_ALLOWED_ORIGINS:-http://127.0.0.1:8080,http://localhost:8080,http://127.0.0.1:5175,http://localhost:5175}

  proxy:
    image: nginx:1.31.0-alpine-slim@sha256:241b0d0fe06250e026e7a35a008d022c9a1d3bec19442d65cc33b84d0b5dd64d
    depends_on:
      - api
      - web
    ports:
      - "${FORGETBASE_PROXY_PORT:-127.0.0.1:8080}:8080"
    volumes:
      - ./infra/docker/nginx.same-origin.conf:/etc/nginx/conf.d/default.conf:ro
