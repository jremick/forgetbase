<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="ForgetBase aperture mark">
  <title>ForgetBase - scoped aperture</title>
  <rect width="64" height="64" rx="14" fill="#1d5a80"/>
  <!-- stable base -->
  <rect x="14" y="14" width="36" height="36" rx="8" fill="#ffffff"/>
  <!-- aperture: a controlled opening into the base -->
  <circle cx="32" cy="32" r="9.5" fill="#1d5a80"/>
  <!-- the one item in scope, recalled through the aperture -->
  <circle cx="32" cy="32" r="3.6" fill="#d7e6f0"/>
</svg>
