<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="ForgetBase boundary mark">
  <title>ForgetBase - permission boundary</title>
  <rect width="64" height="64" rx="14" fill="#1d5a80"/>
  <!-- three solid sides: the permission boundary -->
  <rect x="15" y="15" width="34" height="6" rx="2" fill="#ffffff"/>
  <rect x="15" y="15" width="6" height="34" rx="2" fill="#ffffff"/>
  <rect x="15" y="43" width="34" height="6" rx="2" fill="#ffffff"/>
  <!-- open edge: controlled release at the perimeter -->
  <rect x="43" y="15" width="6" height="34" rx="2" fill="#d7e6f0"/>
</svg>
