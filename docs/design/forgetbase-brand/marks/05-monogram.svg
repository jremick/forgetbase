<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="ForgetBase FB monogram">
  <title>ForgetBase - FB monogram</title>
  <rect width="64" height="64" rx="14" fill="#1d5a80"/>
  <!-- shared stem -->
  <rect x="20" y="14" width="8" height="36" rx="2" fill="#ffffff"/>
  <!-- F top arm / B upper bowl (retained) -->
  <path d="M28 14 H40 a9 9 0 0 1 0 18 H28 Z" fill="#ffffff"/>
  <!-- F middle arm -->
  <rect x="20" y="28" width="13" height="6" rx="2" fill="#ffffff"/>
  <!-- B lower bowl (faded): the monogram performs its own forget -->
  <path d="M28 35 H41 a9.5 9.5 0 0 1 0 15 H28 Z" fill="#d7e6f0"/>
</svg>
