<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="ForgetBase datum mark">
  <title>ForgetBase - datum baseline</title>
  <rect width="64" height="64" rx="14" fill="#1d5a80"/>
  <!-- the base: a reference datum line -->
  <rect x="14" y="40" width="36" height="5" rx="2.5" fill="#ffffff"/>
  <!-- survey marker: a precise point of provenance on the base -->
  <path d="M32 20 L39 33 H25 Z" fill="#ffffff"/>
  <circle cx="32" cy="42.5" r="2.5" fill="#1d5a80"/>
  <!-- released benchmark: a datum let go under policy -->
  <rect x="44" y="36" width="4.5" height="4.5" rx="1.2" fill="#d7e6f0"/>
</svg>
