<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="ForgetBase strata mark">
  <title>ForgetBase - base strata</title>
  <rect width="64" height="64" rx="14" fill="#1d5a80"/>
  <!-- top stratum: displaced and faded - released under a retention policy -->
  <rect x="8" y="15" width="34" height="9" rx="3" fill="#d7e6f0"/>
  <!-- retained strata: the stable base -->
  <rect x="14" y="29" width="34" height="9" rx="3" fill="#ffffff"/>
  <rect x="14" y="41" width="34" height="9" rx="3" fill="#ffffff"/>
</svg>
