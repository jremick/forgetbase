<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="ForgetBase redaction mark">
  <title>ForgetBase - governed redaction</title>
  <rect width="64" height="64" rx="14" fill="#1d5a80"/>
  <!-- a governed record -->
  <rect x="15" y="14" width="34" height="36" rx="5" fill="#ffffff"/>
  <!-- retained line -->
  <rect x="21" y="22" width="22" height="4" rx="2" fill="#1d5a80"/>
  <!-- redacted line: deliberately withheld -->
  <rect x="21" y="30" width="22" height="5" rx="1.5" fill="#154a6a"/>
  <!-- released line: forgotten under policy -->
  <rect x="21" y="39" width="14" height="4" rx="2" fill="#d7e6f0"/>
</svg>
