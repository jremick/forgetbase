services:
  postgres:
    image: pgvector/pgvector:pg17@sha256:d2ef61f42ef767baa5a1475393303cc235bcd92febd9d7014eddb48b41f3bad0
    environment:
      POSTGRES_DB: ${FORGETBASE_POSTGRES_DATABASE:-forgetbase}
      POSTGRES_USER: ${FORGETBASE_POSTGRES_USER:-forgetbase}
      POSTGRES_PASSWORD: ${FORGETBASE_POSTGRES_PASSWORD:?FORGETBASE_POSTGRES_PASSWORD is required}
    ports:
      - "${FORGETBASE_POSTGRES_PORT:-127.0.0.1:5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/docker/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${FORGETBASE_POSTGRES_USER:-forgetbase} -d ${FORGETBASE_POSTGRES_DATABASE:-forgetbase}"]
      interval: 10s
      timeout: 5s
      retries: 5

  migrate:
    image: ${FORGETBASE_MIGRATE_IMAGE:?FORGETBASE_MIGRATE_IMAGE is required}
    environment:
      DATABASE_URL: postgres://${FORGETBASE_POSTGRES_USER:-forgetbase}:${FORGETBASE_POSTGRES_PASSWORD}@postgres:5432/${FORGETBASE_POSTGRES_DATABASE:-forgetbase}
      FORGETBASE_RELEASE_VERSION: ${FORGETBASE_VERSION:?FORGETBASE_VERSION is required}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    image: ${FORGETBASE_API_IMAGE:?FORGETBASE_API_IMAGE is required}
    environment:
      HOST: 0.0.0.0
      PORT: 3000
      DATABASE_URL: postgres://${FORGETBASE_POSTGRES_USER:-forgetbase}:${FORGETBASE_POSTGRES_PASSWORD}@postgres:5432/${FORGETBASE_POSTGRES_DATABASE:-forgetbase}
      FORGETBASE_AUTO_MIGRATE: "false"
      FORGETBASE_VERSION: ${FORGETBASE_VERSION}
      FORGETBASE_SOURCE_REVISION: ${FORGETBASE_SOURCE_REVISION}
      FORGETBASE_RELEASE_CHANNEL: ${FORGETBASE_RELEASE_CHANNEL}
      FORGETBASE_DATABASE_SCHEMA_VERSION: ${FORGETBASE_DATABASE_SCHEMA_VERSION}
      FORGETBASE_UPDATER_VERSION: ${FORGETBASE_UPDATER_VERSION}
      FORGETBASE_INSTALLATION_MODE: managed
      FORGETBASE_UPDATER_URL: ${FORGETBASE_UPDATER_URL:-http://host.docker.internal:3010}
      FORGETBASE_UPDATER_ALLOW_INSECURE_HTTP: ${FORGETBASE_UPDATER_ALLOW_INSECURE_HTTP:-true}
      FORGETBASE_UPDATER_API_TOKEN: ${FORGETBASE_UPDATER_API_TOKEN:?FORGETBASE_UPDATER_API_TOKEN is required}
      FORGETBASE_SYSTEM_UPDATE_OWNER_EMAILS: ${FORGETBASE_SYSTEM_UPDATE_OWNER_EMAILS:?FORGETBASE_SYSTEM_UPDATE_OWNER_EMAILS is required}
      FORGETBASE_OIDC_STATE_SECRET: ${FORGETBASE_OIDC_STATE_SECRET:-}
      FORGETBASE_CORS_ALLOWED_ORIGINS: ${FORGETBASE_CORS_ALLOWED_ORIGINS:-http://127.0.0.1:8080,http://localhost:8080}
      FORGETBASE_REQUIRE_AUTHENTICATION: ${FORGETBASE_REQUIRE_AUTHENTICATION:-true}
      FORGETBASE_LOGIN_SESSION_MAX_AGE_SECONDS: ${FORGETBASE_LOGIN_SESSION_MAX_AGE_SECONDS:-43200}
      FORGETBASE_LOGIN_SESSION_IDLE_TIMEOUT_SECONDS: ${FORGETBASE_LOGIN_SESSION_IDLE_TIMEOUT_SECONDS:-14400}
      FORGETBASE_LOGIN_SESSION_ABSOLUTE_MAX_AGE_SECONDS: ${FORGETBASE_LOGIN_SESSION_ABSOLUTE_MAX_AGE_SECONDS:-2592000}
      FORGETBASE_LOGIN_REFRESH_TOKEN_MAX_AGE_SECONDS: ${FORGETBASE_LOGIN_REFRESH_TOKEN_MAX_AGE_SECONDS:-604800}
    ports:
      - "${FORGETBASE_API_PORT:-127.0.0.1:3000}:3000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --output-document=- http://127.0.0.1:3000/ready >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 10

  worker:
    image: ${FORGETBASE_WORKER_IMAGE:?FORGETBASE_WORKER_IMAGE is required}
    environment:
      DATABASE_URL: postgres://${FORGETBASE_POSTGRES_USER:-forgetbase}:${FORGETBASE_POSTGRES_PASSWORD}@postgres:5432/${FORGETBASE_POSTGRES_DATABASE:-forgetbase}
      FORGETBASE_RETENTION_PURGE_ENABLED: ${FORGETBASE_RETENTION_PURGE_ENABLED:-false}
      FORGETBASE_RETENTION_PURGE_DRY_RUN: ${FORGETBASE_RETENTION_PURGE_DRY_RUN:-true}
      FORGETBASE_CACHE_PURGE_ENABLED: ${FORGETBASE_CACHE_PURGE_ENABLED:-false}
      FORGETBASE_CACHE_PURGE_DRY_RUN: ${FORGETBASE_CACHE_PURGE_DRY_RUN:-true}
    depends_on:
      migrate:
        condition: service_completed_successfully

  web:
    image: ${FORGETBASE_WEB_IMAGE:?FORGETBASE_WEB_IMAGE is required}
    ports:
      - "${FORGETBASE_WEB_PORT:-127.0.0.1:5175}:4173"
    depends_on:
      - api

  proxy:
    image: ${FORGETBASE_PROXY_IMAGE:?FORGETBASE_PROXY_IMAGE is required}
    depends_on:
      - api
      - web
    ports:
      - "${FORGETBASE_PROXY_PORT:-127.0.0.1:8080}:8080"

volumes:
  postgres-data:
