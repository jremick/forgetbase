# Do not log query strings, credentials or referrers.
log_format forgetbase_safe '$remote_addr [$time_local] "$request_method $uri $server_protocol" $status $body_bytes_sent';

server {
  access_log /dev/stdout forgetbase_safe;
  error_log /dev/stderr crit;
  listen 8080;
  server_name _;
  client_max_body_size 10m;

  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; object-src 'none'" always;
  add_header X-Frame-Options "DENY" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
  add_header Cross-Origin-Opener-Policy "same-origin" always;

  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Host $host;
  proxy_set_header X-Forwarded-Port $server_port;
  proxy_set_header X-Forwarded-Proto $scheme;

  location = /api {
    return 308 /api/;
  }
  location = /api/auth/bootstrap {
    return 404;
  }
  location = /api/system/updates {
    return 404;
  }
  location /api/ {
    rewrite ^/api/(.*)$ /$1 break;
    proxy_pass http://172.30.50.4:3000;
  }
  location / {
    root /usr/share/nginx/html;
    try_files $uri $uri/ /index.html;
  }
}
